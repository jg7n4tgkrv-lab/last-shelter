<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Last Shelter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0f0d;
    color: #e8e6df;
    font-family: -apple-system, sans-serif;
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 1px;
    text-align: center;
    color: #c9c2a8;
    margin-bottom: 16px;
  }
  #stats {
    background: #161815;
    border: 1px solid #2a2d27;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    font-size: 15px;
  }
  .stat-label { color: #9a9689; }
  #log {
    background: #14150f;
    border: 1px solid #2a2d27;
    border-radius: 12px;
    padding: 12px;
    min-height: 60px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #b8b4a5;
  }
  #cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: linear-gradient(180deg, #1c1f19, #14160f);
    border: 1px solid #3a3d31;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    font-size: 18px;
    color: #d8d4c4;
  }
  .card:active { background: #24261e; }
  #inventory {
    background: #161815;
    border: 1px solid #2a2d27;
    border-radius: 12px;
    padding: 12px 16px;
  }
  #inventory h2 { font-size: 16px; margin: 0 0 8px 0; color: #c9c2a8; }
  #invList { font-size: 14px; color: #b8b4a5; line-height: 1.6; }
  #campBtn {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: #2a3126;
    border: 1px solid #465340;
    border-radius: 12px;
    color: #d8e4c8;
    font-size: 16px;
  }

  /* Kampf-Screen */
  #combatScreen { display: none; }
  #enemyBox {
    background: #1a1414;
    border: 1px solid #3d2a2a;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    text-align: center;
  }
  #enemyName { font-size: 18px; color: #e0b8b0; margin-bottom: 6px; }
  .barOuter {
    background: #241818;
    border-radius: 8px;
    height: 14px;
    overflow: hidden;
    margin-top: 4px;
  }
  .barInner {
    height: 100%;
    background: #b0453a;
  }
  .barInnerPlayer { background: #4a8a4a; }
  .barInnerBlock { background: #4a7a9a; }
  #combatStatus {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #b8b4a5;
    margin-bottom: 14px;
  }
  #hand {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .handCard {
    background: linear-gradient(180deg, #1c1f19, #14160f);
    border: 1px solid #3a3d31;
    border-radius: 12px;
    padding: 14px;
    color: #d8d4c4;
  }
  .handCard .cName { font-size: 16px; font-weight: bold; }
  .handCard .cDesc { font-size: 13px; color: #9a9689; margin-top: 2px; }
  .handCard .cCost { float: right; color: #d8c878; }
  .handCard:active { background: #24261e; }
  .handCard.disabled { opacity: 0.4; }
  #endTurnBtn {
    width: 100%;
    padding: 14px;
    background: #33291f;
    border: 1px solid #5a4530;
    border-radius: 12px;
    color: #e8d4b8;
    font-size: 16px;
  }
</style>
</head>
<body>

<h1>LAST SHELTER</h1>

<!-- Normaler Erkundungs-Screen -->
<div id="exploreScreen">
  <div id="stats"></div>
  <div id="log">Willkommen. Wähle ein Gebiet zum Erkunden.</div>

  <div id="cards"></div>

  <button id="campBtn" onclick="restAtCamp()">Zurück ins Lager (ausruhen)</button>

  <div id="inventory">
    <h2>Inventar</h2>
    <div id="invList"></div>
  </div>
</div>

<!-- Kampf-Screen -->
<div id="combatScreen">
  <div id="enemyBox">
    <div id="enemyName"></div>
    <div class="barOuter"><div id="enemyBar" class="barInner" style="width:100%"></div></div>
  </div>

  <div id="combatStatus"></div>

  <div class="barOuter" style="margin-bottom:14px;">
    <div id="playerBar" class="barInner barInnerPlayer" style="width:100%"></div>
  </div>

  <div id="hand"></div>

  <button id="endTurnBtn" onclick="endTurn()">Zug beenden</button>
</div>

<script>
const CARD_DB = {
  attack: { name: "Angriff", cost: 1, desc: "8–12 Schaden" },
  defend: { name: "Verteidigen", cost: 1, desc: "+8 Block" },
  dodge:  { name: "Ausweichen", cost: 1, desc: "Blockt den nächsten Angriff komplett" },
  heavy:  { name: "Schwerer Schlag", cost: 2, desc: "18–22 Schaden" },
  heal:   { name: "Erste Hilfe", cost: 1, desc: "+15 Leben" }
};

const DEFAULT_DECK = ["attack","attack","attack","attack","attack","defend","defend","dodge","heavy","heal"];

const ENEMY_TYPES = [
  { name: "Wolf", maxHp: 35, dmgMin: 8, dmgMax: 14 },
  { name: "Plünderer", maxHp: 45, dmgMin: 10, dmgMax: 18 }
];

let state = {
  health: 100,
  hunger: 100,
  energy: 100,
  xp: 0,
  level: 1,
  inventory: [],
  deck: [...DEFAULT_DECK]
};

let combat = null; // nicht gespeichert, nur während eines Kampfes aktiv

const locations = ["Dichter Wald", "Verlassene Ruinen", "Flussufer"];

function loadGame() {
  const saved = localStorage.getItem("lastShelterSave");
  if (saved) {
    const loaded = JSON.parse(saved);
    state = Object.assign({ deck: [...DEFAULT_DECK] }, loaded);
    if (!state.deck || state.deck.length === 0) state.deck = [...DEFAULT_DECK];
  }
}

function saveGame() {
  localStorage.setItem("lastShelterSave", JSON.stringify(state));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  document.getElementById("stats").innerHTML = `
    <div class="stat-row"><span class="stat-label">Leben</span><span>${state.health}</span></div>
    <div class="stat-row"><span class="stat-label">Hunger</span><span>${state.hunger}</span></div>
    <div class="stat-row"><span class="stat-label">Energie</span><span>${state.energy}</span></div>
    <div class="stat-row"><span class="stat-label">XP</span><span>${state.xp}</span></div>
    <div class="stat-row"><span class="stat-label">Level</span><span>${state.level}</span></div>
  `;

  const cardsDiv = document.getElementById("cards");
  cardsDiv.innerHTML = "";
  locations.forEach(loc => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = loc;
    card.onclick = () => explore(loc);
    cardsDiv.appendChild(card);
  });

  const invList = document.getElementById("invList");
  invList.innerHTML = state.inventory.length ? state.inventory.join(", ") : "leer";
}

function log(msg) {
  document.getElementById("log").textContent = msg;
}

function explore(loc) {
  if (state.energy < 10) {
    log("Zu wenig Energie zum Erkunden! Geh zurück ins Lager.");
    return;
  }

  state.energy -= 10;
  state.hunger -= 5;

  const roll = Math.random();
  if (roll < 0.25) {
    state.inventory.push("Holz");
    log(`${loc}: Du hast Holz gefunden.`);
    saveGame(); render();
  } else if (roll < 0.45) {
    state.inventory.push("Beeren");
    state.hunger = Math.min(100, state.hunger + 10);
    log(`${loc}: Du hast Beeren gefunden und etwas gegessen.`);
    saveGame(); render();
  } else if (roll < 0.65) {
    const enemyType = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
    startCombat(enemyType, loc);
    return; // Kampf übernimmt den Screen
  } else if (roll < 0.8) {
    state.health -= 5;
    log(`${loc}: Du hast dich leicht verletzt.`);
    saveGame(); render();
  } else if (roll < 0.95) {
    state.xp += 10;
    log(`${loc}: Nichts Besonderes, aber du hast Erfahrung gesammelt.`);
    checkLevelUp();
    saveGame(); render();
  } else {
    state.xp += 25;
    log(`${loc}: Seltenes Ereignis! Du fühlst dich gestärkt.`);
    checkLevelUp();
    saveGame(); render();
  }

  checkDeathConditions();
  saveGame();
  render();
}

function restAtCamp() {
  state.energy = Math.min(100, state.energy + 40);
  state.hunger = Math.max(0, state.hunger - 10);
  log("Du hast dich im Lager ausgeruht. Energie steigt, aber du wirst etwas hungriger.");
  checkDeathConditions();
  saveGame();
  render();
}

function checkLevelUp() {
  const needed = state.level * 50;
  if (state.xp >= needed) {
    state.level += 1;
    state.xp = 0;
    log(`Level Up! Du bist jetzt Level ${state.level}.`);
  }
}

function checkDeathConditions() {
  if (state.hunger <= 0) {
    state.health -= 5;
  }
  if (state.health <= 0) {
    state.health = 100;
    state.hunger = 100;
    state.energy = 100;
    log("Du bist zusammengebrochen und wurdest gerettet. Werte zurückgesetzt.");
  }
}

/* ---------- KAMPF ---------- */

function startCombat(enemyType, loc) {
  combat = {
    enemyName: enemyType.name,
    enemyHp: enemyType.maxHp,
    enemyMaxHp: enemyType.maxHp,
    dmgMin: enemyType.dmgMin,
    dmgMax: enemyType.dmgMax,
    drawPile: shuffle(state.deck),
    hand: [],
    discardPile: [],
    ap: 3,
    maxAp: 3,
    block: 0,
    locName: loc
  };
  drawCards(5);
  document.getElementById("exploreScreen").style.display = "none";
  document.getElementById("combatScreen").style.display = "block";
  renderCombat();
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (combat.drawPile.length === 0) {
      if (combat.discardPile.length === 0) return;
      combat.drawPile = shuffle(combat.discardPile);
      combat.discardPile = [];
    }
    combat.hand.push(combat.drawPile.pop());
  }
}

function renderCombat() {
  document.getElementById("enemyName").textContent =
    `${combat.enemyName}  (${combat.enemyHp}/${combat.enemyMaxHp})`;
  document.getElementById("enemyBar").style.width =
    Math.max(0, (combat.enemyHp / combat.enemyMaxHp) * 100) + "%";

  document.getElementById("playerBar").style.width =
    Math.max(0, state.health) + "%";

  document.getElementById("combatStatus").innerHTML =
    `<span>Leben: ${state.health}</span><span>Block: ${combat.block}</span><span>AP: ${combat.ap}/${combat.maxAp}</span>`;

  const handDiv = document.getElementById("hand");
  handDiv.innerHTML = "";
  combat.hand.forEach((cardId, index) => {
    const info = CARD_DB[cardId];
    const el = document.createElement("div");
    el.className = "handCard" + (info.cost > combat.ap ? " disabled" : "");
    el.innerHTML = `<span class="cCost">${info.cost} AP</span><div class="cName">${info.name}</div><div class="cDesc">${info.desc}</div>`;
    el.onclick = () => playCard(index);
    handDiv.appendChild(el);
  });
}

function playCard(index) {
  const cardId = combat.hand[index];
  const info = CARD_DB[cardId];
  if (combat.ap < info.cost) return;

  combat.ap -= info.cost;

  if (cardId === "attack") {
    const dmg = 8 + Math.floor(Math.random() * 5);
    combat.enemyHp -= dmg;
  } else if (cardId === "heavy") {
    const dmg = 18 + Math.floor(Math.random() * 5);
    combat.enemyHp -= dmg;
  } else if (cardId === "defend") {
    combat.block += 8;
  } else if (cardId === "dodge") {
    combat.block += 999;
  } else if (cardId === "heal") {
    state.health = Math.min(100, state.health + 15);
  }

  combat.discardPile.push(cardId);
  combat.hand.splice(index, 1);

  if (combat.enemyHp <= 0) {
    winCombat();
    return;
  }

  renderCombat();
}

function endTurn() {
  // Gegner greift an
  let dmg = combat.dmgMin + Math.floor(Math.random() * (combat.dmgMax - combat.dmgMin + 1));
  dmg = Math.max(0, dmg - combat.block);
  state.health -= dmg;
  combat.block = 0;

  if (state.health <= 0) {
    loseCombat();
    return;
  }

  // Restliche Handkarten abwerfen, neue Hand ziehen
  combat.discardPile.push(...combat.hand);
  combat.hand = [];
  combat.ap = combat.maxAp;
  drawCards(5);

  renderCombat();
}

function winCombat() {
  const xpGain = 20;
  state.xp += xpGain;
  checkLevelUp();
  endCombatScreen(`Sieg gegen ${combat.enemyName}! +${xpGain} XP.`);
}

function loseCombat() {
  state.health = 100;
  state.hunger = Math.max(20, state.hunger - 20);
  state.energy = Math.max(20, state.energy - 20);
  endCombatScreen(`Du wurdest besiegt und konntest fliehen. Leben wurde wiederhergestellt.`);
}

function endCombatScreen(message) {
  combat = null;
  document.getElementById("combatScreen").style.display = "none";
  document.getElementById("exploreScreen").style.display = "block";
  log(message);
  saveGame();
  render();
}

loadGame();
render();
</script>

</body>
</html>
