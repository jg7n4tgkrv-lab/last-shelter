<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Last Shelter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0d0b;
    color: #e8e6df;
    font-family: -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    transition: background 0.8s;
  }
  body.night { background: #05060a; }

  #header {
    flex: 0 0 auto;
    padding: 14px 16px 10px 16px;
    border-bottom: 1px solid #22251f;
    background: linear-gradient(180deg, #14160f, #0f110d);
  }
  #header h1 {
    font-size: 17px;
    letter-spacing: 2px;
    text-align: center;
    color: #d4c9a3;
    margin: 0 0 10px 0;
    text-shadow: 0 0 12px rgba(180,160,100,0.15);
  }
  #quickStats { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  #quickStats .qBlock { text-align: center; flex: 1; }
  #quickStats .qLabel { color: #7a776a; font-size: 10px; display:block; letter-spacing: 0.5px; }
  #quickStats .qVal { font-weight: 700; font-size: 16px; transition: color 0.3s; }
  #quickStats .qHealth { color: #8fbf6f; }
  #quickStats .qHunger { color: #d9a75c; }
  #quickStats .qEnergy { color: #6fa8bf; }
  #worldLine {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12px;
    color: #9a9689;
  }
  #worldLine span { display: flex; align-items: center; gap: 4px; }

  #main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px 20px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: tabIn 0.28s ease; }

  @keyframes tabIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #tabbar {
    flex: 0 0 auto;
    display: flex;
    border-top: 1px solid #22251f;
    background: #0f110d;
  }
  .tabBtn {
    flex: 1;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
    background: none;
    border: none;
    color: #605d52;
    font-size: 12px;
    transition: color 0.2s, transform 0.15s;
  }
  .tabBtn:active { transform: scale(0.94); }
  .tabBtn .tIcon { display:block; font-size: 18px; margin-bottom: 2px; transition: transform 0.2s; }
  .tabBtn.active { color: #d8c878; }
  .tabBtn.active .tIcon { transform: scale(1.15); }

  #log {
    background: linear-gradient(180deg, #171912, #12130e);
    border: 1px solid #2a2d27;
    border-radius: 14px;
    padding: 14px;
    min-height: 50px;
    margin-bottom: 14px;
    font-size: 14px;
    color: #b8b4a5;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }
  #log.animate { animation: fadeInLog 0.4s ease; }
  @keyframes fadeInLog {
    from { opacity: 0.2; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, #1d2018, #131510);
    border: 1px solid #3a3d31;
    border-left: 3px solid var(--accent, #5a6b4a);
    border-radius: 14px;
    padding: 18px 8px 14px 8px;
    text-align: center;
    font-size: 15px;
    color: #d8d4c4;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .card .cIcon { display:block; font-size: 24px; margin-bottom: 6px; }
  .card:active { background: #262922; transform: scale(0.96); }
  .card.locked { opacity: 0.35; border-left-color: #444; }
  .card .lockNote { display: block; font-size: 11px; margin-top: 6px; color: #7a776a; }

  #inventory {
    background: linear-gradient(180deg, #171912, #12130e);
    border: 1px solid #2a2d27;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 13px;
    color: #9a9689;
  }
  #inventory span.hd { color: #c9c2a8; display:block; margin-bottom:4px; font-size:12px; }

  .charBox {
    background: linear-gradient(180deg, #171912, #12130e);
    border: 1px solid #2a2d27;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .charBox h2 { font-size: 13px; margin: 0 0 10px 0; color: #9a9689; font-weight: normal; letter-spacing: 0.5px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 14px; }
  .stat-label { color: #b0ac9d; display: flex; align-items: center; gap: 6px; }
  .stat-label .icn { font-size: 15px; width: 18px; text-align: center; }
  .equipItem { color: #d8c878; font-weight: 600; }
  .equipEmpty { color: #6a675c; font-style: italic; }
  .equipList-item {
    background: #1c1f19;
    border: 1px solid #3a3d31;
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
    color: #d8d4c4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .equipList-item:active { background: #262922; transform: scale(0.97); }
  .equipList-item .iBonus { color: #9a9689; font-size: 11px; }
  #xpBarOuter { background:#20231d; border-radius:8px; height:10px; overflow:hidden; margin-top:6px; }
  #xpBarInner { height:100%; background: linear-gradient(90deg, #5a7a3f, #8fbf5f); transition: width 0.5s ease; }

  .campActionBtn {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #1c1f19;
    border: 1px solid #3a3d31;
    border-radius: 12px;
    color: #d8d4c4;
    font-size: 14px;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .campActionBtn .cIcon2 { font-size: 18px; }
  .campActionBtn:active { background: #262922; transform: scale(0.97); }
  .campActionBtn.disabled { opacity: 0.35; }
  .campActionBtn .btnSub { display:block; font-size: 11px; color: #9a9689; margin-top: 2px; }
  .campActionBtn .btnText { flex: 1; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0b0d0b;
    z-index: 30;
    overflow-y: auto;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .overlay.active { display: block; animation: overlayIn 0.28s ease; }
  @keyframes overlayIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #enemyBox {
    position: relative;
    background: linear-gradient(180deg, #201414, #150e0e);
    border: 1px solid #4a2f2f;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    text-align: center;
    overflow: visible;
  }
  #enemyName { font-size: 19px; color: #e6b8ab; margin-bottom: 8px; transition: transform 0.15s; }
  #enemyName.hit { animation: shake 0.3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .barOuter { background: #241818; border-radius: 8px; height: 14px; overflow: hidden; margin-top: 4px; }
  .barInner { height: 100%; background: linear-gradient(90deg, #8a3226, #c05a45); transition: width 0.4s ease; }
  .barInnerPlayer { background: linear-gradient(90deg, #3a6a2f, #6fa84f); }
  #playerBarWrap { position: relative; margin-bottom: 14px; }
  #combatStatus { display: flex; justify-content: space-between; font-size: 14px; color: #b8b4a5; margin-bottom: 14px; }
  #hand { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .handCard {
    background: linear-gradient(160deg, #1d2018, #131510);
    border: 1px solid #3a3d31;
    border-radius: 14px;
    padding: 14px;
    color: #d8d4c4;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .handCard .cName { font-size: 16px; font-weight: bold; display:flex; align-items:center; gap:8px; }
  .handCard .cDesc { font-size: 13px; color: #9a9689; margin-top: 2px; }
  .handCard .cCost { float: right; color: #d8c878; font-weight: 600; }
  .handCard:active { background: #262922; transform: scale(0.97); }
  .handCard.disabled { opacity: 0.4; }
  #endTurnBtn {
    width: 100%; padding: 14px; background: linear-gradient(180deg, #3d3120, #2a2015); border: 1px solid #5a4530;
    border-radius: 12px; color: #e8d4b8; font-size: 16px; font-weight: 600;
    transition: transform 0.12s ease;
  }
  #endTurnBtn:active { transform: scale(0.97); }

  .floatNum {
    position: absolute;
    left: 50%;
    top: 40%;
    font-weight: 800;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 40;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    15% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
  }
  .floatNum.dmg { color: #e2604a; text-shadow: 0 0 6px rgba(226,96,74,0.5); }
  .floatNum.heal { color: #7fcf5f; text-shadow: 0 0 6px rgba(127,207,95,0.5); }
  .floatNum.block { color: #6fb0d9; text-shadow: 0 0 6px rgba(111,176,217,0.5); }

  #perkOverlay h2 { font-size: 16px; color: #d8c878; text-align: center; margin-bottom: 14px; }
  .perkCard {
    background: linear-gradient(160deg, #2a2416, #17130c);
    border: 1px solid #4a3d24;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .perkCard .pIcon { font-size: 26px; display:block; margin-bottom:6px; }
  .perkCard .pName { font-size: 17px; color: #e8d4b8; font-weight: bold; }
  .perkCard .pDesc { font-size: 13px; color: #b0a68c; margin-top: 4px; }
  .perkCard:active { background: #332a18; transform: scale(0.97); }
/* =========================================
   PHASE 9.2 – LOCATION ART
   ========================================= */

#cards .card {
  min-height: 138px;
  padding: 82px 10px 14px;
  overflow: hidden;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border: 1px solid rgba(255,255,255,0.14);
  border-left: 3px solid var(--accent, #5a6b4a);

  color: #ffffff;
  font-weight: 700;

  text-shadow:
    0 2px 4px rgba(0,0,0,0.95),
    0 0 10px rgba(0,0,0,0.75);

  box-shadow:
    inset 0 -70px 60px -30px rgba(0,0,0,0.9),
    0 4px 10px rgba(0,0,0,0.35);
}

/* Emoji der Location-Karten ausblenden */
#cards .card .cIcon {
  display: none;
}

/* 1 – Dichter Wald */
#cards .card:nth-child(1) {
  background-image:
    linear-gradient(
      180deg,
      rgba(5,8,5,0.05) 20%,
      rgba(5,8,5,0.25) 55%,
      rgba(5,8,5,0.92) 100%
    ),
    url("images/backgrounds/forest-day.jpg");
}

/* 2 – Verlassene Ruinen */
#cards .card:nth-child(2) {
  background-image:
    linear-gradient(
      180deg,
      rgba(5,8,5,0.05) 20%,
      rgba(5,8,5,0.25) 55%,
      rgba(5,8,5,0.92) 100%
    ),
    url("images/backgrounds/ruins-sunset.jpg");
}

/* 3 – Flussufer */
#cards .card:nth-child(3) {
  background-image:
    linear-gradient(
      180deg,
      rgba(5,8,5,0.05) 20%,
      rgba(5,8,5,0.25) 55%,
      rgba(5,8,5,0.92) 100%
    ),
    url("images/backgrounds/river-mountains-day.jpg");
}

/* 4 – Berge */
#cards .card:nth-child(4) {
  background-image:
    linear-gradient(
      180deg,
      rgba(5,8,5,0.05) 20%,
      rgba(5,8,5,0.25) 55%,
      rgba(5,8,5,0.92) 100%
    ),
    url("images/backgrounds/snow-mountains.jpg");
}

/* 5 – Sumpf */
#cards .card:nth-child(5) {
  background-image:
    linear-gradient(
      180deg,
      rgba(5,8,5,0.05) 20%,
      rgba(5,8,5,0.25) 55%,
      rgba(5,8,5,0.92) 100%
    ),
    url("images/backgrounds/swamp-fog.jpg");
}

/* Gesperrte Gebiete weiterhin eindeutig erkennen */
#cards .card.locked {
  opacity: 0.46;
  filter: grayscale(0.7);
}

#cards .card.locked .lockNote {
  color: rgba(255,255,255,0.75);
  text-shadow: 0 1px 4px #000;
}/* =========================================
   PHASE 9.2 – UI ICONS
   ========================================= */

.uiIcon {
  width: 18px;
  height: 18px;
  object-fit: contain;
  vertical-align: middle;
}

.qLabel {
  display: flex !important;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.worldIcon {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

.tabBtn .tIcon {
  height: 24px;
  margin-bottom: 3px;
}

.tabBtn .tIcon img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  opacity: 0.72;
  transition: transform 0.2s, opacity 0.2s;
}

.tabBtn.active .tIcon img {
  transform: scale(1.12);
  opacity: 1;
}/* =========================================
   PHASE 9.2 – SECTION ICONS
   ========================================= */

.sectionTitle {
  display: flex;
  align-items: center;
  gap: 7px;
}

.sectionTitle img {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

.stat-label .icn img {
  width: 16px;
  height: 16px;
  object-fit: contain;
  display: block;
}/* =========================================
   PHASE 9.2 – COMBAT ICONS
   ========================================= */

.combatStat {
  display: flex;
  align-items: center;
  gap: 5px;
}

.combatStat img {
  width: 19px;
  height: 19px;
  object-fit: contain;
}

.handCard .cName img {
  width: 25px;
  height: 25px;
  object-fit: contain;
  flex: 0 0 auto;
}/* =========================================
   PHASE 9.2 – PERK ICONS
   ========================================= */

#perkOverlay h2 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#perkOverlay h2 img {
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.perkCard .pIcon img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  display: block;
  margin: 0 auto 6px;
}</style>
</head>
<body>

<div id="header">
  <h1>LAST SHELTER</h1>
  <div id="quickStats"></div>
  <div id="worldLine"></div>
</div>

<div id="main">

  <div class="screen active" id="screenExplore">
    <div id="log">Willkommen. Wähle ein Gebiet zum Erkunden.</div>
    <div id="cards"></div>
    <div id="inventory">
  <span class="hd sectionTitle">
    <img src="images/icons/backpack.png" alt="">
    Inventar
  </span>
  <span id="invList"></span>
</div>
  </div>

  <div class="screen" id="screenCharacter">
    <div class="charBox">
      <h2>Fortschritt</h2>
      <div class="stat-row">
  <span class="stat-label">
    <span class="icn"><img src="images/icons/star.png" alt=""></span>
    Level
  </span>
  <span id="charLevel"></span>
</div>

<div class="stat-row">
  <span class="stat-label">
    <span class="icn"><img src="images/icons/level-up.png" alt=""></span>
    XP
  </span>
  <span id="charXp"></span>
</div>
      <div id="xpBarOuter"><div id="xpBarInner" style="width:0%"></div></div>
    </div>
    <div class="charBox" id="attrsBox"></div>
    <div class="charBox" id="equipmentBox"></div>
    <div class="charBox" id="deckBox"></div>
  </div>

  <div class="screen" id="screenCamp">
    <div class="charBox">
      <h2 class="sectionTitle">
  <img src="images/icons/sleep.png" alt="">
  Schlafen
</h2>
      <div id="sleepBtnWrap"></div>
    </div>
    <div class="charBox">
      <h2 class="sectionTitle">
  <img src="images/icons/berries.png" alt="">
  Essen
</h2>
      <div id="eatBtnWrap"></div>
    </div>
    <div class="charBox">
      <h2 class="sectionTitle">
  <img src="images/icons/heal.png" alt="">
  Verbände
</h2>
      <div id="bandageBtnWrap"></div>
    </div>
    <div class="charBox">
      <h2 class="sectionTitle">
  <img src="images/icons/tools.png" alt="">
  Craften
</h2>
      <div id="craftList"></div>
    </div>
    <div class="charBox">
      <h2 class="sectionTitle">
  <img src="images/icons/sword.png" alt="">
  Kartenschmiede
</h2>
      <div id="forgeList"></div>
    </div>
  </div>

</div>

<div id="tabbar">
  <button class="tabBtn active" data-tab="screenExplore" onclick="switchTab('screenExplore')">
    <span class="tIcon">
      <img src="images/icons/compass.png" alt="">
    </span>
    Erkunden
  </button>

  <button class="tabBtn" data-tab="screenCharacter" onclick="switchTab('screenCharacter')">
    <span class="tIcon">
      <img src="images/icons/character.png" alt="">
    </span>
    Charakter
  </button>

  <button class="tabBtn" data-tab="screenCamp" onclick="switchTab('screenCamp')">
    <span class="tIcon">
      <img src="images/icons/shelter.png" alt="">
    </span>
    Lager
  </button>
</div>

<div class="overlay" id="combatOverlay">
  <div id="enemyBox">
    <div id="enemyName"></div>
    <div class="barOuter"><div id="enemyBar" class="barInner" style="width:100%"></div></div>
  </div>
  <div id="combatStatus"></div>
  <div id="playerBarWrap">
    <div class="barOuter">
      <div id="playerBar" class="barInner barInnerPlayer" style="width:100%"></div>
    </div>
  </div>
  <div id="hand"></div>
  <button id="endTurnBtn" onclick="endTurn()">Zug beenden</button>
</div>

<div class="overlay" id="perkOverlay">
  <h2>🎉 Level Up! Wähle einen Perk:</h2>
  <div id="perkList"></div>
</div>

<script>
const CARD_DB = {
  attack:      { name: "Angriff", cost: 1, desc: "Schaden am Gegner", icon: "⚔️" },
  attack_plus: { name: "Angriff+", cost: 1, desc: "Mehr Schaden als normaler Angriff", icon: "⚔️" },
  defend:      { name: "Verteidigen", cost: 1, desc: "Block aufbauen", icon: "🛡️" },
  defend_plus: { name: "Verteidigen+", cost: 1, desc: "Mehr Block als normales Verteidigen", icon: "🛡️" },
  dodge:       { name: "Ausweichen", cost: 1, desc: "Blockt den nächsten Angriff komplett", icon: "💨" },
  heavy:       { name: "Schwerer Schlag", cost: 2, desc: "Hoher Schaden am Gegner", icon: "🔨" },
  heal:        { name: "Erste Hilfe", cost: 1, desc: "+15 Leben", icon: "❤️‍🩹" }
};
 const CARD_ICON_FILES = {
  attack: "images/icons/attack.png",
  attack_plus: "images/icons/sword.png",
  defend: "images/icons/shield.png",
  defend_plus: "images/icons/shield.png",
  dodge: "images/icons/flee.png",
  heavy: "images/icons/sword.png",
  heal: "images/icons/heal.png"
};

const DEFAULT_DECK = ["attack","attack","attack","attack","attack","defend","defend","dodge","heavy","heal"];

const ENEMY_DB = {
  wolf:   { name: "Wolf", maxHp: 35, dmgMin: 8, dmgMax: 14 },
  looter: { name: "Plünderer", maxHp: 45, dmgMin: 10, dmgMax: 18 },
  bear:   { name: "Bär", maxHp: 70, dmgMin: 14, dmgMax: 22 },
  swamp_thing: { name: "Sumpfkriecher", maxHp: 60, dmgMin: 16, dmgMax: 24 }
};

const LOCATIONS = [
  { id:"wald",   name:"Dichter Wald",       minLevel:1, enemyPool:["wolf","looter"], icon:"🌲", accent:"#5a7a3f" },
  { id:"ruinen", name:"Verlassene Ruinen",  minLevel:1, enemyPool:["wolf","looter"], icon:"🏚️", accent:"#8a7a5f" },
  { id:"fluss",  name:"Flussufer",          minLevel:1, enemyPool:["wolf","looter"], icon:"🏞️", accent:"#4a7a8a" },
  { id:"berge",  name:"Berge",              minLevel:3, enemyPool:["bear"], icon:"⛰️", accent:"#7a7a8a" },
  { id:"sumpf",  name:"Sumpf",              minLevel:5, enemyPool:["swamp_thing"], icon:"🐊", accent:"#5a7a5a" }
];

const PERKS = [
  { id:"str", type:"attr", attr:"staerke", name:"Kraftschub", desc:"+1 Stärke – mehr Schaden im Kampf", icon:"💪" },
  { id:"vit", type:"attr", attr:"vitalitaet", name:"Zähigkeit", desc:"+1 Vitalität – mehr maximales Leben", icon:"❤️" },

  rusty_knife: { name: "Rostiges Messer", type: "weapon", bonus: 2, icon:"🔪" },
  spear:       { name: "Speer", type: "weapon", bonus: 5, icon:"🔱" },
  axe:         { name: "Axt", type: "weapon", bonus: 8, icon:"🪓" },

  leather:     { name: "Lederrüstung", type: "armor", bonus: 6, icon:"🥾" },
  iron_plate:  { name: "Eisenplatte", type: "armor", bonus: 10, icon:"🛡️" },
  crafted_spear: { name: "Speer (selbst gebaut)", type: "weapon", bonus: 3, icon:"🔱" },
  crafted_armor: { name: "Grobe Rüstung", type: "armor", bonus: 3, icon:"🛡️" }
};

const LOOT_TABLE = ["rusty_knife","spear","axe","cloth_wrap","leather","iron_plate"];

const RECIPES = [
  { id:"verband", name:"Verband", cost:{Holz:3}, result:"consumable", desc:"Heilt später 25 Leben", icon:"🩹" },
  { id:"crafted_spear", name:"Speer bauen", cost:{Holz:5}, result:"weapon", desc:"Waffe, +3 Schaden", icon:"🔱" },
  { id:"crafted_armor", name:"Grobe Rüstung bauen", cost:{Holz:5}, result:"armor", desc:"Rüstung, +3 Block", icon:"🛡️" }
];

const WEATHER_TYPES = ["Klar", "Regen", "Nebel", "Sturm"];
const WEATHER_ICONS = {
  "Klar": "images/icons/daylight.png",
  "Regen": "images/icons/rain.png",
  "Nebel": "images/icons/cloudy.png",
  "Sturm": "images/icons/thunderstorm.png"
};

const TIME_ICONS = {
  "Morgen": "images/icons/sunrise.png",
  "Mittag": "images/icons/daylight.png",
  "Abend": "images/icons/daylight.png",
  "Nacht": "images/icons/night.png"
};

let state = {
  health: 100, hunger: 100, energy: 100, xp: 0, level: 1,
  inventory: [], deck: [...DEFAULT_DECK],
  attributes: { staerke:0, vitalitaet:0, geschicklichkeit:0, ueberleben:0, wahrnehmung:0 },
  pendingLevelUps: 0,
  equipmentInventory: [], equipped: { weapon: null, armor: null },
  consumables: [],
  timeHour: 8, weather: "Klar"
};

let combat = null;
let currentTab = "screenExplore";

function loadGame() {
  const saved = localStorage.getItem("lastShelterSave");
  if (saved) {
    const loaded = JSON.parse(saved);
    state = Object.assign({
      deck: [...DEFAULT_DECK],
      attributes: { staerke:0, vitalitaet:0, geschicklichkeit:0, ueberleben:0, wahrnehmung:0 },
      pendingLevelUps: 0,
      equipmentInventory: [], equipped: { weapon: null, armor: null },
      consumables: [], timeHour: 8, weather: "Klar"
    }, loaded);
    if (!state.deck || state.deck.length === 0) state.deck = [...DEFAULT_DECK];
    if (!state.attributes) state.attributes = { staerke:0, vitalitaet:0, geschicklichkeit:0, ueberleben:0, wahrnehmung:0 };
    if (!state.equipmentInventory) state.equipmentInventory = [];
    if (!state.equipped) state.equipped = { weapon: null, armor: null };
    if (!state.consumables) state.consumables = [];
    if (state.timeHour === undefined) state.timeHour = 8;
    if (!state.weather) state.weather = "Klar";
    state.hunger = Math.max(0, state.hunger);
    state.energy = Math.max(0, state.energy);
  }
}

function saveGame() { localStorage.setItem("lastShelterSave", JSON.stringify(state)); }

function getMaxHealth() { return 100 + state.attributes.vitalitaet * 5; }
function getWeaponBonus() { return state.equipped.weapon ? ITEM_DB[state.equipped.weapon].bonus : 0; }
function getArmorBonus() { return state.equipped.armor ? ITEM_DB[state.equipped.armor].bonus : 0; }
function countItem(name) { return state.inventory.filter(i => i === name).length; }
function removeOneItem(name) { const idx = state.inventory.indexOf(name); if (idx !== -1) state.inventory.splice(idx, 1); }
function removeOneFromDeck(cardId) { const idx = state.deck.indexOf(cardId); if (idx !== -1) state.deck.splice(idx, 1); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  document.querySelectorAll(".tabBtn").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
  if (tabId === "screenCamp") renderCamp();
  if (tabId === "screenCharacter") renderCharacter();
}

function getTimeOfDay() {
  const h = state.timeHour;
  if (h >= 5 && h < 11) return "Morgen";
  if (h >= 11 && h < 17) return "Mittag";
  if (h >= 17 && h < 21) return "Abend";
  return "Nacht";
}
function isNight() { return getTimeOfDay() === "Nacht"; }
function advanceTime(hours) {
  state.timeHour = (state.timeHour + hours) % 24;
  if (Math.random() < 0.3) state.weather = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
}
function formatTime() { return `${String(state.timeHour).padStart(2, "0")}:00`; }
function updateBodyClass() { document.body.classList.toggle("night", isNight()); }

function render() {
  updateBodyClass();
  const maxHp = getMaxHealth();

  document.getElementById("quickStats").innerHTML = `
    <div class="qBlock">
      <span class="qLabel">
        <img class="uiIcon" src="images/icons/health.png" alt="">
        LEBEN
      </span>
      <span class="qVal qHealth">${state.health}/${maxHp}</span>
    </div>

    <div class="qBlock">
      <span class="qLabel">
        <img class="uiIcon" src="images/icons/hunger.png" alt="">
        HUNGER
      </span>
      <span class="qVal qHunger">${state.hunger}</span>
    </div>

    <div class="qBlock">
      <span class="qLabel">
        <img class="uiIcon" src="images/icons/energy.png" alt="">
        ENERGIE
      </span>
      <span class="qVal qEnergy">${state.energy}</span>
    </div>
  `;

  const timeOfDay = getTimeOfDay();

  document.getElementById("worldLine").innerHTML = `
    <span>
      <img class="worldIcon" src="${TIME_ICONS[timeOfDay]}" alt="">
      ${formatTime()} · ${timeOfDay}
    </span>

    <span>
      <img class="worldIcon" src="${WEATHER_ICONS[state.weather]}" alt="">
      ${state.weather}
    </span>

    <span>
      <img class="worldIcon" src="images/icons/star.png" alt="">
      Lv. ${state.level}
    </span>
  `;

  const cardsDiv = document.getElementById("cards");
  cardsDiv.innerHTML = "";

  LOCATIONS.forEach(loc => {
    const card = document.createElement("div");
    const unlocked = state.level >= loc.minLevel;

    card.className = "card" + (unlocked ? "" : " locked");
    card.style.setProperty("--accent", loc.accent);

    if (unlocked) {
      card.innerHTML = `<span class="cIcon">${loc.icon}</span>${loc.name}`;
      card.onclick = () => explore(loc);
    } else {
      card.innerHTML = `<span class="cIcon">${loc.icon}</span>${loc.name}<span class="lockNote">🔒 Ab Level ${loc.minLevel}</span>`;
    }

    cardsDiv.appendChild(card);
  });

  document.getElementById("invList").textContent =
    state.inventory.length ? state.inventory.join(", ") : "leer";

  if (currentTab === "screenCharacter") renderCharacter();
  if (currentTab === "screenCamp") renderCamp();
}

function renderCharacter() {
  const needed = state.level * 50;
  document.getElementById("charLevel").textContent = state.level;
  document.getElementById("charXp").textContent = `${state.xp} / ${needed}`;
  document.getElementById("xpBarInner").style.width = Math.min(100, (state.xp / needed) * 100) + "%";

  const a = state.attributes;
  document.getElementById("attrsBox").innerHTML = `
    <h2>📊 Attribute</h2>
    <div class="stat-row"><span class="stat-label"><span class="icn">💪</span>Stärke</span><span>${a.staerke}</span></div>
    <div class="stat-row"><span class="stat-label"><span class="icn">❤️</span>Vitalität</span><span>${a.vitalitaet}</span></div>
    <div class="stat-row"><span class="stat-label"><span class="icn">🤸</span>Geschicklichkeit</span><span>${a.geschicklichkeit}</span></div>
    <div class="stat-row"><span class="stat-label"><span class="icn">🔥</span>Überleben</span><span>${a.ueberleben}</span></div>
    <div class="stat-row"><span class="stat-label"><span class="icn">👁️</span>Wahrnehmung</span><span>${a.wahrnehmung}</span></div>
  `;

  const weapon = state.equipped.weapon ? ITEM_DB[state.equipped.weapon] : null;
  const armor = state.equipped.armor ? ITEM_DB[state.equipped.armor] : null;
  let html = `<h2>🎽 Ausrüstung</h2>`;
  html += `<div class="stat-row"><span class="stat-label"><span class="icn">${weapon ? weapon.icon : "⚔️"}</span>Waffe</span><span class="${weapon ? 'equipItem' : 'equipEmpty'}">${weapon ? weapon.name + " (+" + weapon.bonus + ")" : "keine"}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label"><span class="icn">${armor ? armor.icon : "🛡️"}</span>Rüstung</span><span class="${armor ? 'equipItem' : 'equipEmpty'}">${armor ? armor.name + " (+" + armor.bonus + ")" : "keine"}</span></div>`;
  if (state.equipmentInventory.length > 0) {
    html += `<div style="margin-top:8px; font-size:12px; color:#9a9689;">Zum Ausrüsten antippen:</div>`;
    state.equipmentInventory.forEach((itemId, index) => {
      const item = ITEM_DB[itemId];
      const bonusLabel = item.type === "weapon" ? "+" + item.bonus + " Schaden" : "+" + item.bonus + " Block";
      html += `<div class="equipList-item" onclick="equipItem(${index})"><span>${item.icon} ${item.name}</span><span class="iBonus">${bonusLabel}</span></div>`;
    });
  }
  document.getElementById("equipmentBox").innerHTML = html;

  renderDeckOverview();
}

function renderDeckOverview() {
  const counts = {};
  state.deck.forEach(id => counts[id] = (counts[id] || 0) + 1);
  let html = `<h2>🃏 Deck (${state.deck.length} Karten)</h2>`;
  Object.keys(counts).forEach(cardId => {
    const info = CARD_DB[cardId];
    html += `<div class="stat-row"><span class="stat-label"><span class="icn">${info.icon}</span>${info.name}</span><span>x${counts[cardId]}</span></div>`;
  });
  document.getElementById("deckBox").innerHTML = html;
}

function equipItem(index) {
  const itemId = state.equipmentInventory[index];
  const item = ITEM_DB[itemId];
  const slot = item.type;
  const currentlyEquipped = state.equipped[slot];
  if (currentlyEquipped) state.equipmentInventory.push(currentlyEquipped);
  state.equipped[slot] = itemId;
  state.equipmentInventory.splice(index, 1);
  saveGame();
  renderCharacter();
}

function log(msg) {
  const el = document.getElementById("log");
  el.classList.remove("animate");
  void el.offsetWidth;
  el.textContent = msg;
  el.classList.add("animate");
}

function explore(loc) {
  if (state.energy < 10) { log("Zu wenig Energie zum Erkunden! Geh ins Lager."); return; }

  const ueb = state.attributes.ueberleben;
  let energyCost = Math.max(4, 10 - ueb);
  let hungerCost = Math.max(2, 5 - Math.floor(ueb / 2));
  if (state.weather === "Sturm") energyCost += 5;
  if (state.weather === "Regen") hungerCost += 3;
  state.energy = Math.max(0, state.energy - energyCost);
  state.hunger = Math.max(0, state.hunger - hungerCost);

  advanceTime(2 + Math.floor(Math.random() * 3));

  let dangerThreshold = 0.65;
  if (isNight()) dangerThreshold -= 0.15;

  let roll = Math.random();

  if (roll < 0.25) {
    state.inventory.push("Holz");
    log(`${loc.icon} ${loc.name}: Du hast Holz gefunden.`);
  } else if (roll < 0.45) {
    state.inventory.push("Beeren");
    log(`${loc.icon} ${loc.name}: Du hast Beeren gefunden.`);
  } else if (roll < dangerThreshold) {
    let avoidChance = state.attributes.wahrnehmung * 0.03;
    if (state.weather === "Nebel") avoidChance += 0.1;
    if (Math.random() < avoidChance) {
      state.inventory.push("Holz");
      log(`${loc.icon} ${loc.name}: Deine Wahrnehmung hat dich vor einer Gefahr gewarnt – du hast stattdessen Holz gefunden.`);
    } else {
      const enemyId = loc.enemyPool[Math.floor(Math.random() * loc.enemyPool.length)];
      const nightNote = isNight() ? " In der Dunkelheit wirkt der Gegner gefährlicher." : "";
      startCombat(ENEMY_DB[enemyId], loc.name, nightNote);
      return;
    }
  } else if (roll < 0.85) {
    state.health -= 5;
    log(`${loc.icon} ${loc.name}: Du hast dich leicht verletzt.`);
  } else if (roll < 0.95) {
    state.xp += 10;
    log(`${loc.icon} ${loc.name}: Nichts Besonderes, aber du hast Erfahrung gesammelt.`);
    checkLevelUp();
  } else {
    state.xp += 25;
    log(`${loc.icon} ${loc.name}: Seltenes Ereignis! Du fühlst dich gestärkt.`);
    checkLevelUp();
  }

  checkDeathConditions();
  saveGame();
  render();
  maybeShowPerkSelection();
}

function checkLevelUp() {
  const needed = state.level * 50;
  if (state.xp >= needed) {
    state.level += 1;
    state.xp = 0;
    state.pendingLevelUps = (state.pendingLevelUps || 0) + 1;
    log(`⭐ Level Up! Du bist jetzt Level ${state.level}.`);
  }
}

function checkDeathConditions() {
  if (state.hunger <= 0) state.health -= 5;
  if (state.health <= 0) {
    state.health = getMaxHealth();
    state.hunger = 100;
    state.energy = 100;
    log("💫 Du bist zusammengebrochen und wurdest gerettet. Werte zurückgesetzt.");
  }
}

function renderCamp() {
  document.getElementById("sleepBtnWrap").innerHTML =
    `<button class="campActionBtn" onclick="sleepAtCamp()"><span class="cIcon2">😴</span><span class="btnText">Schlafen<span class="btnSub">Energie voll, +15 Leben, -15 Hunger, springt zum Morgen</span></span></button>`;

  const beerenCount = countItem("Beeren");
  document.getElementById("eatBtnWrap").innerHTML = beerenCount > 0
    ? `<button class="campActionBtn" onclick="eatBerries()"><span class="cIcon2">🍓</span><span class="btnText">Beeren essen (${beerenCount})<span class="btnSub">+15 Hunger</span></span></button>`
    : `<button class="campActionBtn disabled"><span class="cIcon2">🍓</span><span class="btnText">Keine Beeren im Inventar</span></button>`;

  const bandageCount = state.consumables.filter(c => c === "verband").length;
  document.getElementById("bandageBtnWrap").innerHTML = bandageCount > 0
    ? `<button class="campActionBtn" onclick="useBandage()"><span class="cIcon2">🩹</span><span class="btnText">Verband benutzen (${bandageCount})<span class="btnSub">+25 Leben</span></span></button>`
    : `<button class="campActionBtn disabled"><span class="cIcon2">🩹</span><span class="btnText">Keine Verbände vorhanden</span></button>`;

  const craftDiv = document.getElementById("craftList");
  craftDiv.innerHTML = "";
  RECIPES.forEach(recipe => {
    const holzHave = countItem("Holz");
    const canCraft = holzHave >= recipe.cost.Holz;
    const btn = document.createElement("button");
    btn.className = "campActionBtn" + (canCraft ? "" : " disabled");
    btn.innerHTML = `<span class="cIcon2">${recipe.icon}</span><span class="btnText">${recipe.name} (${recipe.cost.Holz} Holz)<span class="btnSub">${recipe.desc} – du hast ${holzHave} Holz</span></span>`;
    btn.onclick = canCraft ? () => craftItem(recipe) : null;
    craftDiv.appendChild(btn);
  });

  renderForge();
}

function renderForge() {
  const holz = countItem("Holz");
  const atkCount = state.deck.filter(c => c === "attack").length;
  const defCount = state.deck.filter(c => c === "defend").length;

  const forgeDiv = document.getElementById("forgeList");
  forgeDiv.innerHTML = "";

  const entries = [
    { label: "Angriffskarte schmieden", cost: 4, icon: "⚔️", action: () => forgeCard("attack", 4), can: holz >= 4 },
    { label: "Verteidigen-Karte schmieden", cost: 4, icon: "🛡️", action: () => forgeCard("defend", 4), can: holz >= 4 },
    { label: "Angriff verbessern → Angriff+", cost: 6, icon: "🗡️", action: () => upgradeDeckCard("attack", "attack_plus", 6), can: holz >= 6 && atkCount > 0, note: atkCount === 0 ? "Keine Angriffskarte im Deck" : null },
    { label: "Verteidigen verbessern → Verteidigen+", cost: 6, icon: "🔰", action: () => upgradeDeckCard("defend", "defend_plus", 6), can: holz >= 6 && defCount > 0, note: defCount === 0 ? "Keine Verteidigen-Karte im Deck" : null }
  ];

  entries.forEach(entry => {
    const btn = document.createElement("button");
    btn.className = "campActionBtn" + (entry.can ? "" : " disabled");
    const subText = entry.note ? entry.note : `Kosten: ${entry.cost} Holz – du hast ${holz} Holz`;
    btn.innerHTML = `<span class="cIcon2">${entry.icon}</span><span class="btnText">${entry.label}<span class="btnSub">${subText}</span></span>`;
    btn.onclick = entry.can ? entry.action : null;
    forgeDiv.appendChild(btn);
  });
}

function forgeCard(cardId, cost) {
  if (countItem("Holz") < cost) return;
  for (let i = 0; i < cost; i++) removeOneItem("Holz");
  state.deck.push(cardId);
  saveGame();
  render();
  renderCamp();
}

function upgradeDeckCard(fromId, toId, cost) {
  const idx = state.deck.indexOf(fromId);
  if (idx === -1 || countItem("Holz") < cost) return;
  for (let i = 0; i < cost; i++) removeOneItem("Holz");
  state.deck[idx] = toId;
  saveGame();
  render();
  renderCamp();
}

function sleepAtCamp() {
  state.energy = 100;
  state.health = Math.min(getMaxHealth(), state.health + 15);
  state.hunger = Math.max(0, state.hunger - 15);
  state.timeHour = 7;
  state.weather = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
  log("😴 Du hast im Lager geschlafen und dich erholt. Ein neuer Morgen beginnt.");
  checkDeathConditions();
  saveGame();
  render();
  renderCamp();
}

function eatBerries() {
  if (countItem("Beeren") === 0) return;
  removeOneItem("Beeren");
  state.hunger = Math.min(100, state.hunger + 15);
  saveGame();
  render();
  renderCamp();
}

function useBandage() {
  const idx = state.consumables.indexOf("verband");
  if (idx === -1) return;
  state.consumables.splice(idx, 1);
  state.health = Math.min(getMaxHealth(), state.health + 25);
  saveGame();
  render();
  renderCamp();
}

function craftItem(recipe) {
  const holzHave = countItem("Holz");
  if (holzHave < recipe.cost.Holz) return;
  for (let i = 0; i < recipe.cost.Holz; i++) removeOneItem("Holz");
  if (recipe.result === "consumable") state.consumables.push(recipe.id);
  else state.equipmentInventory.push(recipe.id);
  saveGame();
  render();
  renderCamp();
}

function getAvailablePerks() {
  return PERKS.filter(p => {
    if (p.type === "card" && p.requiresCard) {
      return state.deck.includes(p.requiresCard);
    }
    return true;
  });
}

function maybeShowPerkSelection() {
  if (state.pendingLevelUps > 0) showPerkOverlay();
}

function showPerkOverlay() {
  document.getElementById("perkOverlay").classList.add("active");
  const pool = getAvailablePerks();
  const choices = shuffle(pool).slice(0, 3);
  const list = document.getElementById("perkList");
  list.innerHTML = "";
  choices.forEach(perk => {
    const el = document.createElement("div");
    el.className = "perkCard";
    el.innerHTML = `<span class="pIcon">${perk.icon}</span><div class="pName">${perk.name}</div><div class="pDesc">${perk.desc}</div>`;
    el.onclick = () => choosePerk(perk);
    list.appendChild(el);
  });
}

function choosePerk(perk) {
  if (perk.type === "attr") {
    state.attributes[perk.attr] += 1;
  } else if (perk.effect === "addCard") {
    state.deck.push(perk.card);
  } else if (perk.effect === "removeCard") {
    removeOneFromDeck(perk.card);
  } else if (perk.effect === "upgradeCard") {
    const idx = state.deck.indexOf(perk.from);
    if (idx !== -1) state.deck[idx] = perk.to;
  }

  state.pendingLevelUps -= 1;
  saveGame();

  if (state.pendingLevelUps > 0) {
    showPerkOverlay();
  } else {
    document.getElementById("perkOverlay").classList.remove("active");
    render();
  }
}

function startCombat(enemyType, locName, extraNote) {
  const nightBonus = isNight() ? 1.2 : 1.0;
  combat = {
    enemyName: enemyType.name,
    enemyHp: enemyType.maxHp,
    enemyMaxHp: enemyType.maxHp,
    dmgMin: Math.round(enemyType.dmgMin * nightBonus),
    dmgMax: Math.round(enemyType.dmgMax * nightBonus),
    drawPile: shuffle(state.deck),
    hand: [], discardPile: [],
    ap: 3, maxAp: 3, block: 0, locName: locName
  };
  drawCards(5);
  document.getElementById("combatOverlay").classList.add("active");
  renderCombat();
  if (extraNote) log(extraNote);
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (combat.drawPile.length === 0) {
      if (combat.discardPile.length === 0) return;
      combat.drawPile = shuffle(combat.discardPile);
      combat.discardPile = [];
    }
    combat.hand.push(combat.drawPile.pop());
  }
}

function spawnFloatNumber(containerEl, text, cssClass) {
  const num = document.createElement("div");
  num.className = "floatNum " + cssClass;
  num.textContent = text;
  num.style.left = (40 + Math.random() * 20) + "%";
  containerEl.appendChild(num);
  setTimeout(() => num.remove(), 900);
}

function renderCombat() {
  updateBodyClass();
  const maxHp = getMaxHealth();
  document.getElementById("enemyName").textContent = `${combat.enemyName}  (${combat.enemyHp}/${combat.enemyMaxHp})`;
  document.getElementById("enemyBar").style.width = Math.max(0, (combat.enemyHp / combat.enemyMaxHp) * 100) + "%";
  document.getElementById("playerBar").style.width = Math.max(0, (state.health / maxHp) * 100) + "%";
  document.getElementById("combatStatus").innerHTML = `
  <span class="combatStat">
    <img src="images/icons/health.png" alt="">
    ${state.health}/${maxHp}
  </span>

  <span class="combatStat">
    <img src="images/icons/shield.png" alt="">
    ${combat.block}
  </span>

  <span class="combatStat">
    <img src="images/icons/energy.png" alt="">
    ${combat.ap}/${combat.maxAp}
  </span>
`;

  const handDiv = document.getElementById("hand");
  handDiv.innerHTML = "";
  combat.hand.forEach((cardId, index) => {
    const info = CARD_DB[cardId];
    const el = document.createElement("div");
    el.className = "handCard" + (info.cost > combat.ap ? " disabled" : "");
    el.innerHTML = `
  <span class="cCost">${info.cost} AP</span>

  <div class="cName">
    <img src="${CARD_ICON_FILES[cardId]}" alt="">
    ${info.name}
  </div>

  <div class="cDesc">${info.desc}</div>
`;
    el.onclick = () => playCard(index);
    handDiv.appendChild(el);
  });
}

function playCard(index) {
  const cardId = combat.hand[index];
  const info = CARD_DB[cardId];
  if (combat.ap < info.cost) return;
  combat.ap -= info.cost;
  const str = state.attributes.staerke;
  const dex = state.attributes.geschicklichkeit;
  const weaponBonus = getWeaponBonus();
  const armorBonus = getArmorBonus();

  const enemyBox = document.getElementById("enemyBox");
  const playerBarWrap = document.getElementById("playerBarWrap");

  if (cardId === "attack" || cardId === "attack_plus" || cardId === "heavy") {
    let dmg;
    if (cardId === "attack") dmg = 8 + Math.floor(Math.random() * 5) + str * 2 + weaponBonus;
    else if (cardId === "attack_plus") dmg = 14 + Math.floor(Math.random() * 5) + str * 2 + weaponBonus;
    else dmg = 18 + Math.floor(Math.random() * 5) + str * 3 + weaponBonus;
    combat.enemyHp -= dmg;
    spawnFloatNumber(enemyBox, "-" + dmg, "dmg");
    document.getElementById("enemyName").classList.remove("hit");
    void document.getElementById("enemyName").offsetWidth;
    document.getElementById("enemyName").classList.add("hit");
  } else if (cardId === "defend" || cardId === "defend_plus") {
    const blockGain = cardId === "defend" ? 8 + dex * 2 + armorBonus : 14 + dex * 2 + armorBonus;
    combat.block += blockGain;
    spawnFloatNumber(playerBarWrap, "+" + blockGain + " Block", "block");
  } else if (cardId === "dodge") {
    combat.block += 999;
    spawnFloatNumber(playerBarWrap, "Ausgewichen!", "block");
  } else if (cardId === "heal") {
    const before = state.health;
    state.health = Math.min(getMaxHealth(), state.health + 15);
    spawnFloatNumber(playerBarWrap, "+" + (state.health - before), "heal");
  }

  combat.discardPile.push(cardId);
  combat.hand.splice(index, 1);

  if (combat.enemyHp <= 0) { winCombat(); return; }
  renderCombat();
}

function endTurn() {
  let dmg = combat.dmgMin + Math.floor(Math.random() * (combat.dmgMax - combat.dmgMin + 1));
  dmg = Math.max(0, dmg - combat.block);
  state.health -= dmg;
  combat.block = 0;

  if (dmg > 0) {
    spawnFloatNumber(document.getElementById("playerBarWrap"), "-" + dmg, "dmg");
  }

  if (state.health <= 0) { loseCombat(); return; }

  combat.discardPile.push(...combat.hand);
  combat.hand = [];
  combat.ap = combat.maxAp;
  drawCards(5);
  renderCombat();
}

function winCombat() {
  state.xp += 20;
  checkLevelUp();
  let lootMsg = "";
  if (Math.random() < 0.4) {
    const itemId = LOOT_TABLE[Math.floor(Math.random() * LOOT_TABLE.length)];
    state.equipmentInventory.push(itemId);
    lootMsg = ` 🎁 Beute gefunden: ${ITEM_DB[itemId].icon} ${ITEM_DB[itemId].name}!`;
  }
  endCombatOverlay(`🏆 Sieg gegen ${combat.enemyName}! +20 XP.${lootMsg}`);
}

function loseCombat() {
  state.health = getMaxHealth();
  state.hunger = Math.max(0, state.hunger - 20);
  state.energy = Math.max(0, state.energy - 20);
  endCombatOverlay(`💫 Du wurdest besiegt und konntest fliehen. Leben wurde wiederhergestellt.`);
}

function endCombatOverlay(message) {
  combat = null;
  document.getElementById("combatOverlay").classList.remove("active");
  log(message);
  saveGame();
  render();
  maybeShowPerkSelection();
}

loadGame();
render();
maybeShowPerkSelection();
</script>

</body>
</html>
